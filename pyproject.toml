# Root tooling configuration ONLY — this directory is not itself a package.
#
# Importable code lives in:
#   packages/agent-core
#   apps/backend

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.11"
strict = true
mypy_path = "packages/agent-core/src:apps/backend/src"
files = [
    "packages/agent-core/src",
    "packages/agent-core/tests",
    "apps/backend/src",
    "apps/backend/tests",
]

[tool.pytest.ini_options]
testpaths = ["packages/agent-core/tests", "apps/backend/tests"]
addopts = "-q"
markers = [
    "live: tests that call a real external AI API (opt-in, skipped unless credentials are present)",
]

[[tool.mypy.overrides]]
module = "openai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pywinauto", "pywinauto.*", "win32api", "PIL", "PIL.*"]
ignore_missing_imports = true
