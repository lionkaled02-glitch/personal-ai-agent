[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-core"
version = "0.6.0"
description = "Core abstractions for a modular personal autonomous AI agent: tasks, planner, executor, tools, permissions, events, model gateway, model providers, workspace filesystem boundary, document processing & lexical knowledge retrieval."
readme = "README.md"
requires-python = ">=3.11"
# Deliberately minimal: the core must not depend on any vendor SDK or
# parser library.
dependencies = ["pydantic>=2.7,<3"]

# Real provider adapters are optional extras. Installing one is required
# only when you actually select that provider (MODEL_PROVIDER=...).
[project.optional-dependencies]
openai = ["openai>=1.40,<3"]
# Document parsing (Phase 4). Without it, the binary parsers (PDF, DOCX,
# PPTX, XLSX) fail with a structured `parser_unavailable` error at parse
# time; TXT and Markdown parsing never requires any extra.
docs = [
    "pypdf>=4.0,<7",
    "python-docx>=1.0,<2",
    "python-pptx>=1.0,<2",
    "openpyxl>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
